name: Scientific finite checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Separate benign scalar group-total regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 90s python -B -m unittest discover -s regressions -p test_group_totals.py -v 2>&1 | tee group-total-regressions.log
      - name: Reproduce and enforce all scientific failure gates
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 900s bash -c '
            set -euo pipefail
            ulimit -v 1048576
            ulimit -t 900
            python -B run_complete.py --out scientific-output --compare results
          ' 2>&1 | tee scientific-checks.log
      - name: Preserve raw outputs even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: |
            scientific-output/
            scientific-checks.log
            group-total-regressions.log
          if-no-files-found: warn
          retention-days: 14
